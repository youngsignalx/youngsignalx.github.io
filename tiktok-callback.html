<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ShortsBot TikTok Login</title>
<style>
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#5f6368; --accent:#1a5fd0; --box:#f1f3f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#ececec; --muted:#a0a0a0; --accent:#7fb0ff; --box:#232323; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }
  main { max-width:680px; margin:0 auto; padding:48px 16px; }
  textarea { width:100%; box-sizing:border-box; height:120px; font:14px/1.4 ui-monospace, Consolas, monospace;
             background:var(--box); color:var(--fg); border:1px solid var(--muted); border-radius:8px; padding:10px; }
  button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  p.muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ShortsBot – TikTok login</h1>
  <p id="msg">Copy the text below and paste it into the ShortsBot window on your computer.</p>
  <textarea id="out" readonly></textarea>
  <button id="copy" type="button">Copy</button>
  <p class="muted">Nothing is sent anywhere from this page. The login code is only shown here so you can paste it
  into the app running on your own computer. It expires after a few minutes.</p>
</main>
<script>
  const out = document.getElementById('out');
  out.value = location.href;
  const q = new URLSearchParams(location.search);
  if (q.get('error')) document.getElementById('msg').textContent = 'TikTok returned an error: ' + q.get('error') + ' ' + (q.get('error_description') || '');
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(out.value); document.getElementById('copy').textContent = 'Copied'; }
    catch (e) { out.select(); }
  };
</script>
</body>
</html>
